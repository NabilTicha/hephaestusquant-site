<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forecast · Hephaestus Quant</title>
  <meta name="description" content="View a painted probability forecast with the realised price path overlaid." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="site-name">Hephaestus Quant</a>
      <button class="menu-toggle" onclick="document.querySelector('nav').classList.toggle('open')" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <nav>
        <a href="/kernel.html">Kernel</a>
        <a href="/doctrine.html">Doctrine</a>
        <a href="/leaderboard.html">Leaderboard</a>
        <div class="nav-dropdown">
          <span class="nav-dropdown-trigger">Drills</span>
          <div class="nav-dropdown-menu">
            <a href="/forecast.html">Forecast</a>
            <a href="/80-in-8.html">80-in-8</a>
          </div>
        </div>
        <a href="/about.html">About</a>
        <a href="/apply.html">Apply</a>
        <div id="auth-ui"></div>
      </nav>
    </div>
  </header>

  <main class="container">

    <section class="hero" id="forecast-hero">
      <div class="loading">Loading forecast...</div>
    </section>

    <section id="forecast-body" style="display:none;">
      <div class="painter-canvas-wrap">
        <canvas id="forecast-view-canvas"></canvas>
        <div id="forecast-view-readout" class="painter-readout"></div>
      </div>
      <div class="painter-status" style="margin-top: var(--space-md);">
        <span id="forecast-view-legend">
          <span class="legend-swatch" style="background: rgba(184, 156, 75, 0.85);"></span> Painted density
          &nbsp;&nbsp;
          <span class="legend-swatch" style="background: #5ec8ff; border-radius: 50%;"></span> Realised price
          &nbsp;&nbsp;
          <span class="legend-swatch" style="background: rgba(255,255,255,0.5); border-radius: 50%; width: 4px; height: 4px;"></span> Reference (submission-time spot)
        </span>
      </div>
      <div id="forecast-justification" class="forecast-justification" style="display:none;"></div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>Hephaestus Quant · TU Delft</span>
      <span>2025</span>
    </div>
  </footer>

  <script src="/js/auth.js"></script>
  <script src="/js/forecast-view.js"></script>

</body>
</html>
