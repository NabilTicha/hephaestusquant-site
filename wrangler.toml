name = "hephaestusquant-site"
compatibility_date = "2024-12-30"
pages_build_output_dir = "."

[[d1_databases]]
binding = "FORECAST_DB"
database_name = "hephaestus-forecast"
database_id = "8b20c7bb-4c7f-4f7f-9a87-afbbf18624be"

[vars]
# Register the app at https://entra.microsoft.com → App registrations.
# Account types: "Accounts in this organizational directory only (TU Delft)".
# Redirect URI: https://hephaestusquant.org/api/auth/microsoft/callback
MS_CLIENT_ID = ""           # Application (client) ID from Entra
MS_TENANT_ID = ""           # Directory (tenant) ID — TU Delft's tenant
MS_REDIRECT_URI = "https://hephaestusquant.org/api/auth/microsoft/callback"
SITE_URL = "https://hephaestusquant.org"

# MS_CLIENT_SECRET and JWT_SECRET must be set as encrypted secrets:
# wrangler pages secret put MS_CLIENT_SECRET
# wrangler pages secret put JWT_SECRET
